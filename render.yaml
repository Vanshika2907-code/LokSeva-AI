services:
  - type: web
    name: lokseva-ai
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      # Vite embeds these two values into the browser bundle at build time.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Server-only credentials. Render prompts for these when a new Blueprint
      # is created, but their values are never stored in this repository.
      - key: GEMINI_API_KEY
        sync: false
      # Free Render web services block outbound SMTP. OTP email is delivered
      # through Resend's HTTPS API instead.
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
